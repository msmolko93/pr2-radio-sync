name: Radio sync (PR2 + W tonacji Trójki)

on:
  schedule:
    # GitHub cron dziala w UTC. 05:00 UTC = 07:00 Europe/Warsaw (lato, CEST)
    # / 06:00 (zima, CET). Uruchomienia bywaja opoznione o kilka-kilkanascie minut.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # pozwala odpalic recznie z zakladki "Actions"

# potrzebne do commita "keepalive", ktory chroni harmonogram przed
# automatycznym wylaczeniem po 60 dniach bezczynnosci repo
permissions:
  contents: write

concurrency:
  group: pr2-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # twardy limit — bieg nie może wisieć w nieskonczonosc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uruchom sync PR2
        env:
          # jawne (Client ID jest publiczny z natury, Playlist ID to zwykly identyfikator)
          SPOTIFY_CLIENT_ID: "0fef0c2097a2403fb77e3db052d1aa37"
          SPOTIFY_PLAYLIST_ID: "3hdsfKIX3McCTV995EZuFn"
          # tajne — z GitHub Secrets
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 sync.py

      - name: Uruchom sync "W tonacji Trójki"
        env:
          SPOTIFY_CLIENT_ID: "0fef0c2097a2403fb77e3db052d1aa37"
          SPOTIFY_WTT_PLAYLIST_ID: "52vFjYeh1pIlNu1SDDFVhy"
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 sync_wtt.py

      - name: Keepalive (chroni harmonogram przed wylaczeniem po 60 dniach)
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_sync.txt
          git config user.name "pr2-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sync.txt
          git commit -m "keepalive: $(date -u +%F)" || true
          git push || true
