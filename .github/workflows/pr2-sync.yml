name: PR2 daily sync

on:
  schedule:
    # GitHub cron dziala w UTC. 05:00 UTC = 07:00 Europe/Warsaw (lato, CEST)
    # / 06:00 (zima, CET). Uruchomienia bywaja opoznione o kilka-kilkanascie minut.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # pozwala odpalic recznie z zakladki "Actions"

# potrzebne do commita "keepalive", ktory chroni harmonogram przed
# automatycznym wylaczeniem po 60 dniach bezczynnosci repo
permissions:
  contents: write

concurrency:
  group: pr2-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uruchom sync PR2
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
        run: python3 sync.py

      - name: Keepalive (chroni harmonogram przed wylaczeniem po 60 dniach)
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_sync.txt
          git config user.name "pr2-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sync.txt
          git commit -m "keepalive: $(date -u +%F)" || true
          git push || true
